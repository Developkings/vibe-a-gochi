; Vibe-a-Gochi firmware — Hosyond ES3C28P (ESP32-S3 N16R8, 2.8" ILI9341 + FT6336 touch)
;
; The UI in src/ui and src/ui_fonts is generated: edit ui/tools/gen_ui.py, run
;   python ui/tools/gen_ui.py --build
; and rebuild this project. Do not edit those folders by hand.
;
; Build from PowerShell (pioarduino's tools refuse to run under Git Bash/MSYS):
;   $env:PLATFORMIO_CORE_DIR="C:\pio"; python -m platformio run -d firmware

[env:es3c28p]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
monitor_speed = 115200
extra_scripts = ota.py   ; -t ota: flash over WiFi (after one USB flash with this in it)
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
lib_deps =
    lovyan03/LovyanGFX @ ^1.2.0
    lvgl/lvgl @ 9.2.2
    bblanchon/ArduinoJson @ ^7.0.0
    h2zero/NimBLE-Arduino @ ^2.3.0
    bitbank2/AnimatedGIF @ ^2.1.1
    ESP32Async/AsyncTCP @ ^3.4.0
    ESP32Async/ESPAsyncWebServer @ ^3.7.0
